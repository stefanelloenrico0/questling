      <path d="M164 86 l-4 -8 8 0z M170 80 l-4 -8 8 0z M176 88 l-4 -8 8 0z" fill="#ef7d57"/>
    </g>
    <!-- mantello -->
    <path d="M70 150 Q52 212 60 252 L180 252 Q188 212 170 150 Z" fill="url(#cloak)"/>
    <path d="M170 150 Q188 212 180 252 L150 252 Q164 212 156 152 Z" fill="#175d47" opacity=".4"/>
