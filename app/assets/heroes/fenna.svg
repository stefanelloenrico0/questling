<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -24 262 304" role="img" aria-label="Fenna, la Ranger">
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58c878"/><stop offset="1" stop-color="#1f7d5a"/></linearGradient>
    <linearGradient id="cloakD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9c66"/><stop offset="1" stop-color="#175d47"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8d6a8"/><stop offset="1" stop-color="#b89868"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa86b"/><stop offset="1" stop-color="#d9552f"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#8f5a3c"/></linearGradient>
  </defs>
  <ellipse class="shadow" cx="120" cy="256" rx="64" ry="9" fill="#1a1c2c" opacity=".32"/>
