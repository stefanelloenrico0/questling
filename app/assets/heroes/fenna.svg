    <path d="M70 108 Q66 44 120 38 Q174 44 170 108 Q170 140 150 150 L90 150 Q70 140 70 108 Z" fill="url(#cloak)"/>
    <path d="M90 150 Q120 156 150 150 Q170 140 170 108 Q166 130 150 140 Q120 150 90 140 Q74 130 70 108 Q70 140 90 150 Z" fill="url(#cloakD)"/>
