    <path d="M88 150 L160 214" stroke="#8f5a3c" stroke-width="9" stroke-linecap="round" opacity=".95"/>
    <path d="M88 150 L160 214" stroke="#c98b5a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
