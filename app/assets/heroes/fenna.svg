    <rect x="88" y="238" width="36" height="17" rx="8.5" fill="#5c3a2e"/>
    <rect x="120" y="238" width="36" height="17" rx="8.5" fill="#5c3a2e"/>
    <!-- tunica -->
    <path d="M82 150 Q120 142 158 150 L164 220 Q120 232 76 220 Z" fill="url(#tunic)"/>
    <path d="M76 202 Q120 216 164 202 L164 216 Q120 230 76 216 Z" fill="#8f5a3c"/>
    <rect x="112" y="204" width="16" height="16" rx="4" fill="#ffcd75"/>
