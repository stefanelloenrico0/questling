      <circle cx="106" cy="99.4" r="2.2" fill="#fff"/><circle cx="138" cy="99.4" r="2.2" fill="#fff"/>
    </g>
    <path d="M94 88 Q104 82 114 88" stroke="#a8431f" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M126 86 Q136 78 146 84" stroke="#a8431f" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M108 122 Q122 130 136 118" stroke="#9a5a56" stroke-width="3" fill="none" stroke-linecap="round"/>
