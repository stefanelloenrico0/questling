    <path d="M82 156 Q60 170 62 208 Q62 218 72 216 Q80 214 82 204 Q84 186 98 172 Z" fill="url(#cloak)"/>
    <path d="M158 156 Q180 170 178 208 Q178 218 168 216 Q160 214 158 204 Q156 186 142 172 Z" fill="url(#cloak)"/>
    <ellipse cx="70" cy="218" rx="9.5" ry="9" fill="#f6c9a2"/>
    <ellipse cx="170" cy="218" rx="9.5" ry="9" fill="#f6c9a2"/>
